<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueEstimation | Музыка</title>
    <!-- Подключаем современный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Подключаем Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Красивый градиентный фон */
        .bg-mesh {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh text-white min-h-screen p-4 md:p-8">
    
    <div class="max-w-3xl mx-auto">
        
        <!-- Шапка (с эффектом стекла) -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 bg-white/5 backdrop-blur-md p-5 rounded-2xl border border-white/10 shadow-2xl gap-4">
            <div class="flex items-center gap-3">
                <!-- Иконка нотки -->
                <div class="bg-gradient-to-br from-green-400 to-emerald-600 p-2 rounded-xl text-black shadow-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight">TrueEstimation</h1>
            </div>
            
            <!-- Форма входа -->
            <div id="auth-section" class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                <input type="email" id="email" placeholder="Email" class="bg-black/30 border border-white/10 p-2.5 rounded-xl text-white outline-none focus:border-green-500 transition-colors w-full sm:w-40">
                <input type="password" id="password" placeholder="Пароль" class="bg-black/30 border border-white/10 p-2.5 rounded-xl text-white outline-none focus:border-green-500 transition-colors w-full sm:w-40">
                <button onclick="login()" class="bg-white text-black hover:bg-gray-200 px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg active:scale-95">Войти</button>
            </div>
            
            <!-- Профиль юзера -->
            <div id="user-info" class="hidden items-center gap-4 bg-black/30 px-4 py-2 rounded-xl border border-white/10">
                <span id="user-email" class="text-gray-300 text-sm font-medium"></span>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 font-bold text-sm transition-colors">Выйти</button>
            </div>
        </header>

        <!-- Список треков -->
        <main id="tracks-container" class="space-y-5">
            <div class="flex justify-center py-10">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-green-500"></div>
            </div>
        </main>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
