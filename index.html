<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueEstimation | Музыка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-mesh {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
            margin-top: -5px; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-mesh text-white min-h-screen pb-40">
    
    <div class="max-w-3xl mx-auto p-4 md:p-8">
        
        <!-- Шапка -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white/5 backdrop-blur-md p-5 rounded-2xl border border-white/10 shadow-2xl gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-green-400 to-emerald-600 p-2 rounded-xl text-black shadow-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight">TrueEstimation</h1>
            </div>
            
            <div id="auth-section" class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                <input type="email" id="email" placeholder="Email" class="bg-black/30 border border-white/10 p-2.5 rounded-xl text-white outline-none focus:border-green-500 transition-colors w-full sm:w-40">
                <input type="password" id="password" placeholder="Пароль" class="bg-black/30 border border-white/10 p-2.5 rounded-xl text-white outline-none focus:border-green-500 transition-colors w-full sm:w-40">
                <button onclick="login()" class="bg-white text-black hover:bg-gray-200 px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg active:scale-95">Войти</button>
            </div>
            
            <div id="user-info" class="hidden items-center gap-4 bg-black/30 px-4 py-2 rounded-xl border border-white/10">
                <span id="user-email" class="text-gray-300 text-sm font-medium"></span>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 font-bold text-sm transition-colors">Выйти</button>
            </div>
        </header>

        <div id="stats-container" class="text-center text-sm font-medium text-gray-400 mb-8 bg-white/5 py-2 rounded-xl border border-white/5 backdrop-blur-sm">
            Загрузка статистики...
        </div>

        <main id="tracks-container" class="space-y-4">
            <div class="flex justify-center py-10">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-green-500"></div>
            </div>
        </main>

    </div>

    <!-- ГЛОБАЛЬНЫЙ ФИКСИРОВАННЫЙ ПЛЕЕР (НА ВСЮ ШИРИНУ) -->
    <div id="global-player" class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-xl border-t border-white/10 p-3 md:px-8 z-50 hidden">
        <div class="w-full max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Левая часть: Обложка и Название (Прижато влево) -->
            <div class="flex items-center gap-4 w-full md:w-[30%] min-w-0">
                <img id="player-cover" src="" class="w-14 h-14 md:w-16 md:h-16 rounded-lg object-cover shadow-2xl hidden md:block shrink-0" onerror="this.style.display='none'">
                <div class="truncate w-full">
                    <div id="player-title" class="font-bold text-base md:text-lg truncate text-white">Название трека</div>
                    <div id="player-artist" class="text-sm text-gray-400 truncate">Исполнитель / Лейбл</div>
                </div>
            </div>

            <!-- Центральная часть: Кнопка Play и Прогресс -->
            <div class="flex-1 flex flex-col items-center gap-1 w-full max-w-2xl">
                <button id="global-play-btn" onclick="toggleGlobalPlay()" class="w-12 h-12 flex items-center justify-center bg-white text-black hover:scale-105 rounded-full transition-transform active:scale-95 shadow-xl mb-2">
                    <svg id="global-play-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                
                <div class="flex items-center gap-3 w-full">
                    <span id="global-current-time" class="text-xs text-gray-400 w-10 text-right font-medium">0:00</span>
                    <div class="flex-1 h-1.5 bg-white/20 rounded-full relative cursor-pointer group">
                        <div id="global-progress-bar" class="absolute h-full bg-green-500 rounded-full w-0 shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>
                        <input type="range" id="global-slider" min="0" max="100" value="0" step="0.1" oninput="seekGlobalAudio(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <span id="global-duration" class="text-xs text-gray-400 w-10 font-medium">0:00</span>
                </div>
            </div>

            <!-- Правая часть: Громкость (Прижато вправо) -->
            <div class="w-full md:w-[30%] flex justify-end items-center gap-3 hidden md:flex">
                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <div class="w-28 h-1.5 bg-white/20 rounded-full relative cursor-pointer">
                    <div id="volume-progress-bar" class="absolute h-full bg-green-500 rounded-full w-full"></div>
                    <input type="range" id="global-volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
