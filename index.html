<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueEstimation | Музыка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-mesh {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }
        
        /* --- ИДЕАЛЬНЫЕ ПОЛЗУНКИ --- */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 8px 0;
            display: block;
        }
        input[type=range]:focus {
            outline: none;
        }
        /* Сама полоса */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        /* Кружок */
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
            -webkit-appearance: none;
            /* ИДЕАЛЬНАЯ МАТЕМАТИКА: (Высота полосы 6 - Высота кружка 16) / 2 = -5 */
            margin-top: -5px; 
            box-shadow: 0 0 10px rgba(34,197,94,0.6);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(34,197,94,0.9);
        }
        
        /* Стили для скроллбара */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="bg-mesh text-white min-h-screen pb-40">
    
    <div class="max-w-7xl mx-auto p-4 md:p-8 flex flex-col md:flex-row gap-8">
        
        <!-- ЛЕВОЕ МЕНЮ -->
        <aside class="w-full md:w-64 flex-shrink-0">
            <div class="sticky top-8 bg-white/5 backdrop-blur-md p-5 rounded-2xl border border-white/10 shadow-2xl">
                <div class="flex items-center gap-3 mb-8">
                    <div class="bg-gradient-to-br from-green-400 to-emerald-600 p-2 rounded-xl text-black shadow-lg">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    </div>
                    <h1 class="text-xl font-extrabold tracking-tight">TrueEst</h1>
                </div>
                
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Навигация</h3>
                <div id="categories-container" class="space-y-2 flex flex-col">
                    <!-- Категории -->
                </div>
            </div>
        </aside>

        <!-- ПРАВАЯ ЧАСТЬ -->
        <main class="flex-1 min-w-0">
            <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white/5 backdrop-blur-md p-4 rounded-2xl border border-white/10 shadow-lg gap-4">
                <div id="stats-container" class="text-sm font-medium text-gray-400">Загрузка...</div>
                
                <div id="auth-section" class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                    <input type="email" id="email" placeholder="Email" class="bg-black/30 border border-white/10 p-2 rounded-lg text-white outline-none focus:border-green-500 transition-colors w-full sm:w-32 text-sm">
                    <input type="password" id="password" placeholder="Пароль" class="bg-black/30 border border-white/10 p-2 rounded-lg text-white outline-none focus:border-green-500 transition-colors w-full sm:w-32 text-sm">
                    <button onclick="login()" class="bg-white text-black hover:bg-gray-200 px-4 py-2 rounded-lg font-bold transition-all shadow-md active:scale-95 text-sm">Войти</button>
                </div>
                
                <div id="user-info" class="hidden items-center gap-4 bg-black/30 px-4 py-2 rounded-lg border border-white/10">
                    <span id="user-email" class="text-gray-300 text-xs font-medium"></span>
                    <button onclick="logout()" class="text-red-400 hover:text-red-300 font-bold text-xs transition-colors">Выйти</button>
                </div>
            </header>

            <!-- Главное меню (Hero) -->
            <div id="hero-container" class="hidden mb-10"></div>

            <!-- Список треков -->
            <div id="list-view-container">
                <div class="flex justify-between items-end mb-4">
                    <h2 id="current-category-title" class="text-2xl font-bold">Все треки</h2>
                </div>
                <div id="tracks-container" class="space-y-3">
                    <div class="flex justify-center py-10">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-green-500"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ГЛОБАЛЬНЫЙ ПЛЕЕР -->
    <div id="global-player" class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-xl border-t border-white/10 p-3 md:px-6 z-40 hidden">
        <div class="w-full flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4 w-full md:w-1/3 min-w-0 justify-start">
                <img id="player-cover" src="" class="w-14 h-14 md:w-16 md:h-16 rounded-lg object-cover shadow-2xl hidden md:block shrink-0" onerror="this.style.display='none'">
                <div class="truncate w-full">
                    <div id="player-title" class="font-bold text-base truncate text-white">Трек</div>
                    <div id="player-artist" class="text-sm text-gray-400 truncate">Исполнитель</div>
                </div>
            </div>
            <div class="flex-1 flex flex-col items-center gap-1 w-full max-w-xl">
                <button id="global-play-btn" onclick="toggleGlobalPlay()" class="w-10 h-10 flex items-center justify-center bg-white text-black hover:scale-105 rounded-full transition-transform active:scale-95 shadow-xl mb-2">
                    <svg id="global-play-icon" class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="flex items-center gap-3 w-full">
                    <span id="global-current-time" class="text-xs text-gray-400 w-10 text-right font-medium">0:00</span>
                    <div class="flex-1 h-1.5 bg-white/20 rounded-full relative cursor-pointer group">
                        <div id="global-progress-bar" class="absolute h-full bg-green-500 rounded-full w-0"></div>
                        <input type="range" id="global-slider" min="0" max="100" value="0" step="0.1" oninput="seekGlobalAudio(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <span id="global-duration" class="text-xs text-gray-400 w-10 font-medium">0:00</span>
                </div>
            </div>
            <div class="w-full md:w-1/3 flex justify-end items-center gap-3 hidden md:flex">
                <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <div class="w-28 h-1.5 bg-white/20 rounded-full relative cursor-pointer">
                    <div id="volume-progress-bar" class="absolute h-full bg-green-500 rounded-full w-full"></div>
                    <input type="range" id="global-volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОЦЕНКИ -->
    <div id="rating-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-gray-800 to-gray-900 border border-white/10 rounded-3xl p-6 md:p-8 w-full max-w-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-r from-green-500/20 to-purple-500/20 blur-2xl -z-10"></div>
            <button onclick="closeRatingModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 p-2 rounded-full transition-all z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            
            <div class="flex items-center gap-5 mb-8 z-10 relative">
                <img id="modal-track-cover" src="" class="w-24 h-24 md:w-28 md:h-28 rounded-2xl object-cover shadow-2xl border border-white/20" onerror="this.style.display='none'">
                <div>
                    <h3 class="text-2xl md:text-3xl font-extrabold mb-1 line-clamp-1" id="modal-track-title">Название</h3>
                    <p class="text-gray-400 font-medium" id="modal-track-artist">Исполнитель</p>
                </div>
            </div>
            
            <div class="space-y-4 mb-8 z-10 relative">
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-gray-300 font-semibold">Текст и смысл</span>
                        <span id="val-crit-1" class="text-green-400 font-bold bg-green-400/10 px-2 py-0.5 rounded">3 / 6</span>
                    </div>
                    <input type="range" id="crit-1" min="1" max="6" value="3" oninput="updateTotalScore()">
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-gray-300 font-semibold">Бит и ритмика</span>
                        <span id="val-crit-2" class="text-green-400 font-bold bg-green-400/10 px-2 py-0.5 rounded">3 / 6</span>
                    </div>
                    <input type="range" id="crit-2" min="1" max="6" value="3" oninput="updateTotalScore()">
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-gray-300 font-semibold">Сведение и мастеринг</span>
                        <span id="val-crit-3" class="text-green-400 font-bold bg-green-400/10 px-2 py-0.5 rounded">3 / 6</span>
                    </div>
                    <input type="range" id="crit-3" min="1" max="6" value="3" oninput="updateTotalScore()">
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-gray-300 font-semibold">Вайб и атмосфера</span>
                        <span id="val-crit-4" class="text-green-400 font-bold bg-green-400/10 px-2 py-0.5 rounded">3 / 6</span>
                    </div>
                    <input type="range" id="crit-4" min="1" max="6" value="3" oninput="updateTotalScore()">
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-gray-300 font-semibold">Оригинальность</span>
                        <span id="val-crit-5" class="text-green-400 font-bold bg-green-400/10 px-2 py-0.5 rounded">3 / 6</span>
                    </div>
                    <input type="range" id="crit-5" min="1" max="6" value="3" oninput="updateTotalScore()">
                </div>
            </div>

            <div class="flex items-center justify-between border-t border-white/10 pt-6 z-10 relative">
                <div class="flex items-baseline gap-2">
                    <span class="text-gray-400 text-sm font-medium">Итог:</span>
                    <span id="modal-total-score" class="text-5xl font-extrabold text-white">15</span>
                    <span class="text-gray-500 font-bold text-lg">/ 30</span>
                </div>
                <button onclick="submitRating()" class="bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-400 hover:to-emerald-400 text-black px-10 py-4 rounded-2xl font-extrabold text-lg transition-transform active:scale-95 shadow-[0_0_20px_rgba(34,197,94,0.4)]">
                    Сохранить
                </button>
            </div>
        </div>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ УВЕДОМЛЕНИЙ (TOASTS) -->
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
